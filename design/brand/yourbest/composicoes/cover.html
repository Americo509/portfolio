<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html{background:#05080d}
body{width:1920px;height:1200px;overflow:hidden;background:radial-gradient(ellipse 60% 75% at 66% 50%,#1b3756 0%,#0d1f33 40%,#05080d 80%);position:relative;font-family:sans-serif}
.logo{position:absolute;left:150px;top:50%;transform:translateY(-50%);width:560px}
.logo img{width:100%;display:block}
.phone{position:absolute;border-radius:62px;background:#0b0f15;padding:14px;box-shadow:0 50px 120px rgba(0,0,0,.65),0 0 0 2px #1c2633 inset}
.phone img{display:block;width:100%;border-radius:48px}
.p1{width:380px;left:850px;top:205px;transform:rotate(-6deg);opacity:.92}
.p2{width:430px;left:1125px;top:120px;z-index:2}
.p3{width:380px;left:1440px;top:215px;transform:rotate(6deg);opacity:.92}
</style></head><body>
<div class="logo"><img src="logo-dark.svg"></div>
<div class="phone p1"><img src="../../../../public/images/yourbest/aceitar-servico.jpg"></div>
<div class="phone p2"><img src="../../../../public/images/yourbest/tela-principal.jpg"></div>
<div class="phone p3"><img src="../../../../public/images/yourbest/agenda.jpg"></div>
</body></html>
